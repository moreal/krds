nodeLinker: pnpm
yarnPath: .yarn/releases/yarn-4.14.1.cjs
enableGlobalCache: false

# Missing upstream peer forwarding, not runtime/version overrides. Each consumer
# declares the exact runtime/compiler in its own manifest. See tools/README.md.
packageExtensions:
  # astro2tsx 0.1.3 imports wasm-runtime, whose runtime peer is incorrectly
  # dev-only in astro2tsx. Match its published dev pin; no runtime override.
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': '1.11.3'
  '@nx/js@24.0.2':
    peerDependencies:
      nx: '24.0.2'
  '@angular-devkit/build-angular@22.2.5':
    peerDependencies:
      '@angular/compiler': '^22.0.0'
  '@storybook/vue3-vite@10.6.5':
    peerDependencies:
      vue: '^3.0.0'
  '@storybook/web-components-vite@10.6.5':
    peerDependencies:
      lit: '^3.0.0'
  '@testing-library/vue@8.1.0':
    peerDependencies:
      '@vue/compiler-dom': '^3.0.0'
      '@vue/server-renderer': '3.x'
    peerDependenciesMeta:
      '@vue/server-renderer':
        optional: true
  'storybook-framework-qwik@0.6.1':
    peerDependencies:
      storybook: '^10.6.5'
      typescript: '>=4.9'
      vite: '^7.0.0'
  'storybook@10.6.5':
    peerDependencies:
      react: '^19.3.1'
      # Angular's preset calls the shared Storybook resolver for these packages.
      '@angular-devkit/build-angular': '>=18.0.0 < 23.0.0'
      '@angular/animations': '>=18.0.0 < 23.0.0'
    peerDependenciesMeta:
      '@angular-devkit/build-angular':
        optional: true
      '@angular/animations':
        optional: true
  # Both browser packages import the mocker's Node entry, which imports Vite.
  # Forward each consumer's own Vite peer instead of supplying a shared version.
  '@vitest/browser@4.1.10':
    peerDependencies:
      vite: '^6.0.0 || ^7.0.0 || ^8.0.0'
  '@vitest/browser-playwright@4.1.10':
    peerDependencies:
      vite: '^6.0.0 || ^7.0.0 || ^8.0.0'
