        if: always()
        timeout-minutes: 2
        with:
          name: native-worker-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  native-ci-result:
    name: Mandatory native CI result
    if: always()
    needs: [select-and-check, native-stable, native-shared, native-docs, native-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize diagnostics before checkout
        timeout-minutes: 2
        run: |
          started_ms=$(( $(date +%s) * 1000 ))
          echo "CI_JOB_STARTED_MS=$started_ms" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/krds-playwright-1.64.1" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-ci-diagnostics"
          printf '{"schemaVersion":1,"status":"failed","workerId":"%s","sourceSha":"%s","pairs":[],"cache":{"status":"incomplete","projects":[]},"error":"Job setup or execution did not complete"}\n' "${CI_WORKER_ID:-checks}" "$GITHUB_SHA" > "$RUNNER_TEMP/native-ci-diagnostics/job-diagnostic.json"
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: ${{ needs.select-and-check.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with:
          name: native-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with:
          pattern: native-worker-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker-results
          merge-multiple: false
      - name: Validate mandatory jobs and exact stable and preview evidence
        timeout-minutes: 2
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p test-results/ci
          printf '%s\n' "$NEEDS_JSON" > test-results/ci/needs.json
          node tools/ci/aggregate.mjs --manifest test-results/ci/manifest.json --results worker-results --needs test-results/ci/needs.json
      - name: Collect diagnostic fallback
        timeout-minutes: 1
        if: always()
        run: |
          mkdir -p test-results/ci
          cp "$RUNNER_TEMP/native-ci-diagnostics/job-diagnostic.json" test-results/ci/job-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: native-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
