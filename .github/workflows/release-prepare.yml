name: Release preparation (mandatory gates; no publication)

# Preparing: T13/T14/T16 must provide every real command checked by required-gates.mjs.
# Missing gates fail; this workflow does not declare a candidate ready before they exist and pass.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Preview source version plans or verify a reviewed versioned HEAD
        required: true
        type: choice
        default: prepare-versions
        options:
          - prepare-versions
          - verify-candidate

      pattern-review-extras:
        description: Optional repository-relative JSON path to authentic current pattern reviews
        required: false
        type: string
      docs-review-extras:
        description: Optional repository-relative JSON path to authentic current docs review and metadata
        required: false
        type: string
      manual-accessibility-extras:
        description: Optional repository-relative JSON path to performed human sessions and original media
        required: false
        type: string
      independent-review-extras:
        description: Optional repository-relative JSON path to authentic current independent release review
        required: false
        type: string

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'
  NX_INTERACTIVE: 'false'
  NG_BUILD_MAX_WORKERS: '2'
  PLAYWRIGHT_BROWSERS_PATH: /private/tmp/krds-playwright-1.64.1
  KRDS_RELEASE_SOURCE_SHA: ${{ github.sha }}
  KRDS_RELEASE_CANDIDATE_MANIFEST: artifacts/manifest.json
  KRDS_RELEASE_EVIDENCE_DIRECTORY: test-results/ci
  KRDS_RELEASE_CHANNELS: stable,solid2-preview
  KRDS_RELEASE_PHASE: ${{ inputs.phase }}

jobs:
  version-preview:
    name: Version and changelog dry-run only (no candidate acceptance)
    if: ${{ inputs.phase == 'prepare-versions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: node tools/ci/check-toolchain.mjs
      - run: node tools/yarn.mjs install --immutable
      - run: node tools/ci/check-toolchain.mjs --installed
      - name: Check source plans and retain the real Nx dry-run result
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/ci
          node tools/ci/check-release-phase.mjs --phase prepare-versions 2>&1 | tee test-results/ci/version-preview-phase.log
          node tools/ci/selection.mjs --full
          node tools/ci/check-plans.mjs 2>&1 | tee test-results/ci/version-preview-plans.log
          node tools/ci/prepare-release.mjs --dry-run 2>&1 | tee test-results/ci/version-preview-nx.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-preview-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/ci/version-preview-*.log
            test-results/ci/release-phase.json
            test-results/ci/selection.json
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: Verify the reviewed versioned candidate at this HEAD
    if: ${{ inputs.phase == 'verify-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: node tools/ci/check-toolchain.mjs
      - name: Prepare the browser cache path required by the native pattern producers
        run: sudo install -d -o "$(id -un)" -g "$(id -gn)" "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Capture every accepted producer against this reviewed HEAD
        # The helper checks source before install and again via check-release-phase.mjs --phase verify-candidate.
        # Missing authored reviews/sessions remain failing assembly gates; no synthetic extras are created.
        env:
          KRDS_RELEASE_PATTERN_REVIEW_EXTRAS: ${{ inputs.pattern-review-extras }}
          KRDS_RELEASE_DOCS_REVIEW_EXTRAS: ${{ inputs.docs-review-extras }}
          KRDS_RELEASE_MANUAL_ACCESSIBILITY_EXTRAS: ${{ inputs.manual-accessibility-extras }}
          KRDS_RELEASE_INDEPENDENT_REVIEW_EXTRAS: ${{ inputs.independent-review-extras }}
        run: node tools/ci/collect-release-evidence.mjs
      - name: Preserve the exact candidate for the final mandatory job
        run: node tools/ci/create-candidate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/ci/candidate.tgz
            test-results/ci/candidate.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-preparation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            artifacts/
          if-no-files-found: error
          retention-days: 14

  verify-release:
    name: Final mandatory T16 acceptance
    needs: prepare
    if: ${{ always() && inputs.phase == 'verify-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail if any preceding preparation gate failed or was skipped
        env:
          PREPARATION_RESULT: ${{ needs.prepare.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@v4
        with:
          name: prepared-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci
      - name: Verify and restore the exact versioned candidate
        run: node tools/ci/restore-candidate.mjs
      - run: node tools/yarn.mjs install --immutable
      - run: node tools/ci/check-toolchain.mjs --installed
      - run: node tools/ci/required-gates.mjs
      - run: node tools/yarn.mjs exec playwright install --with-deps chromium firefox webkit
      - name: Require T16 acceptance of this complete candidate
        run: node tools/yarn.mjs verify:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/releases/
            test-results/ci/
          if-no-files-found: error
          retention-days: 14
