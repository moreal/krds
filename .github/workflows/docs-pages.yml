name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set portable browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/krds-playwright-1.64.1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Check exact Node and vendored Yarn
        run: node tools/ci/check-toolchain.mjs
      - name: Install immutable workspace dependencies
        run: node tools/yarn.mjs install --immutable
      - name: Check workspace and installed toolchain
        run: |
          node tools/yarn.mjs exec node tools/ci/check-toolchain.mjs --installed
          node tools/yarn.mjs verify:workspace
      - uses: actions/configure-pages@v5
      - name: Build native Vue prerequisites and documentation
        run: node tools/yarn.mjs nx run krds-docs:build
      - name: Validate Vue types, references, downloads and rights
        run: |
          node tools/yarn.mjs workspace @unofficial-krds/docs typecheck
          node tools/yarn.mjs workspace @unofficial-krds/docs test
          node tools/yarn.mjs verify:licenses
      - name: Verify reproducible deployment bytes
        run: node tools/yarn.mjs workspace @unofficial-krds/docs test:reproducibility
      - name: Install selected Chromium and WebKit builds
        run: node tools/yarn.mjs workspace @unofficial-krds/docs exec playwright install --with-deps chromium webkit
      - name: Check prefixed site in both browsers
        run: |
          node tools/yarn.mjs exec node apps/docs/scripts/serve.mjs > /tmp/krds-docs-server.log 2>&1 &
          docs_server_pid=$!
          trap 'kill "$docs_server_pid"' EXIT
          node tools/yarn.mjs workspace @unofficial-krds/docs test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-pages-checks
          path: test-results/docs-pages
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v4
